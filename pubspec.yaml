name: pharma_pos
description: Complete Pharmacy POS System - Online/Offline with Sync

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.0.0

  # Local Database (SQLite via Drift)
  drift: ">=2.30.0 <2.33.0"
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Remote Database
  # Pinned below 2.15.0: from 2.15.0 onward supabase_flutter pulls in the
  # `passkeys` package, whose Windows plugin requires webauthn.dll (only
  # present on Windows 10 1903+), which crashes app startup on Windows 8/8.1.
  supabase_flutter: ">=2.6.0 <2.15.0"

  # Connectivity
  connectivity_plus: ^6.0.3

  # Printing
  pdf: ^3.11.1
  printing: ^5.13.1
  esc_pos_utils_plus: ^2.0.0

  # Charts & Analytics
  fl_chart: ^0.68.0

  # UI Components
  flutter_svg: ^2.0.10
  shimmer: ^3.0.0
  badges: ^3.1.2
  data_table_2: ^2.5.13
  dropdown_search: ^5.0.6
  intl: ^0.20.2

  # Utils
  uuid: ^4.4.0
  shared_preferences: ^2.2.3
  collection: ^1.18.0
  equatable: ^2.0.5

  # Barcode
  barcode_widget: ^2.0.4

  # Storage
  hive_flutter: ^1.1.0

  # Date Picker
  table_calendar: ^3.1.2

  # Export
  excel: ^4.0.3
  csv: ^6.0.0

  # Icons
  cupertino_icons: ^1.0.8
  iconsax: ^0.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ">=2.30.0 <2.33.0"
  build_runner: ^2.4.12
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
